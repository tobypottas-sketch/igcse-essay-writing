name: Apply Estimated Grade
on:
  push:
    branches: [feat/estimated-0511-grades-20261016]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/estimated-0511-grades-20261016
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-estimated-grade.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add essay-app.html
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "feat: add estimated 0511 essay grade band"
            git push
          fi
