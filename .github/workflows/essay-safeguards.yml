name: Essay Safeguards

on:
  push:
    branches:
      - main
      - feat/essay-writing-safeguards
      - fix/fourth-hardening-audit-20261014
      - style/essay-suite-refresh-20261014
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate Essay visual refresh preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/style/essay-suite-refresh-20261014'
        run: node scripts/apply-essay-suite-refresh.mjs
      - run: node --test tests/*.test.mjs
      - name: Upload refreshed Essay preview
        if: github.event_name == 'push' && github.ref == 'refs/heads/style/essay-suite-refresh-20261014'
        uses: actions/upload-artifact@v4
        with:
          name: essay-suite-refresh-preview
          path: index.html
