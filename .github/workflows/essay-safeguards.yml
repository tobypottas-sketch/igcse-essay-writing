name: Essay Safeguards

on:
  push:
    branches:
      - main
      - feat/essay-writing-safeguards
      - fix/fourth-hardening-audit-20261014
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply fourth-audit patch
        if: github.ref == 'refs/heads/fix/fourth-hardening-audit-20261014'
        run: python scripts/fourth_patch.py
      - name: Commit fourth-audit patch
        if: github.ref == 'refs/heads/fix/fourth-hardening-audit-20261014'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: harden Essay local content boundaries"
          git push
      - run: node --test tests/*.test.mjs
