name: Essay Safeguards

on:
  push:
    branches:
      - main
      - feat/essay-writing-safeguards
      - fix/fourth-hardening-audit-20261014
      - audit/eighth-hardening-20261015
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
