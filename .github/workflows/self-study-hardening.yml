name: Essay Self-Study Hardening

on:
  push:
    branches:
      - feat/self-study-hardening

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/apply-self-study-hardening.mjs
      - run: node --test tests/self-study-hardening.test.mjs
      - name: Commit generated Essay hardening
        run: |
          if git diff --quiet -- index.html; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "feat: harden and restyle Essay Writing"
          git push
