name: Essay Self-Study Hardening

on:
  push:
    branches:
      - feat/self-study-hardening

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/self-study-hardening.test.mjs
